name: CI

on:
  push:
    branches: [main, master]
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (Maven)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - name: Test
        working-directory: warehouse-back
        run: mvn -B -DskipTests=false test

  frontend:
    name: Frontend (Vue)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: warehouse-front/package-lock.json
      - name: Install
        working-directory: warehouse-front
        run: npm ci
      - name: Build
        working-directory: warehouse-front
        run: npm run build

  deploy:
    name: Deploy
    needs: [backend, frontend]
    if: github.event_name == 'push' && (github.ref == 'refs/heads/master' || github.ref == 'refs/heads/main')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - name: Package backend
        working-directory: warehouse-back
        run: mvn -B -Ppro -DskipTests package
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: warehouse-front/package-lock.json
      - name: Package frontend
        working-directory: warehouse-front
        run: npm ci && npm run build:prod
      - name: Publish to server
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_PORT: ${{ secrets.SSH_PORT }}
          SSH_USER: ${{ secrets.SSH_USER }}
          SSH_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          WEB_ROOT: ${{ vars.WEB_ROOT }}
          APP_DIR: ${{ vars.APP_DIR }}
          JAR_NAME: ${{ vars.JAR_NAME }}
          RESTART_MODE: ${{ vars.RESTART_MODE }}
          PHARMA_SERVICE: ${{ vars.PHARMA_SERVICE }}
          PHARMA_ENV_FILE: ${{ vars.PHARMA_ENV_FILE }}
        run: |
          set -euo pipefail
          if [[ -z "${SSH_HOST}" || -z "${SSH_USER}" || -z "${SSH_KEY}" ]]; then
            echo "仓库 Secrets 缺少 SSH_HOST、SSH_USER 或 SSH_PRIVATE_KEY，发布停止"
            exit 1
          fi
          port="${SSH_PORT:-22}"
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -p "$port" -H "$SSH_HOST" >> ~/.ssh/known_hosts
          stage="$RUNNER_TEMP/pharma-incoming"
          jar_name="${JAR_NAME:-warehouse.jar}"
          built_jar="$(find warehouse-back/target -path '*warehouse-back-pro/warehouse-back.jar' -print -quit)"
          if [[ -z "$built_jar" || ! -d "$(dirname "$built_jar")/lib" ]]; then
            echo "没有找到生产分发包里的 warehouse-back.jar 和 lib"
            exit 1
          fi
          mkdir -p "$stage/dist" "$stage/deploy"
          cp "$built_jar" "$stage/$jar_name"
          cp -a "$(dirname "$built_jar")/lib" "$stage/lib"
          cp -a warehouse-front/dist/. "$stage/dist/"
          cp deploy/backup.sh deploy/remote-release.sh "$stage/deploy/"
          chmod +x "$stage/deploy/"*.sh
          tar -C "$RUNNER_TEMP" -czf "$RUNNER_TEMP/pharma-incoming.tgz" pharma-incoming
          scp -i ~/.ssh/deploy_key -P "$port" \
            "$RUNNER_TEMP/pharma-incoming.tgz" \
            "${SSH_USER}@${SSH_HOST}:~/pharma-incoming.tgz"
          ssh -i ~/.ssh/deploy_key -p "$port" "${SSH_USER}@${SSH_HOST}" \
            "WEB_ROOT='${WEB_ROOT}' APP_DIR='${APP_DIR}' JAR_NAME='${JAR_NAME}' RESTART_MODE='${RESTART_MODE}' PHARMA_SERVICE='${PHARMA_SERVICE}' PHARMA_ENV_FILE='${PHARMA_ENV_FILE}' bash -s" <<'EOF'
          set -euo pipefail
          rm -rf "$HOME/pharma-incoming"
          tar -xzf "$HOME/pharma-incoming.tgz" -C "$HOME"
          exec bash "$HOME/pharma-incoming/deploy/remote-release.sh" "$HOME/pharma-incoming"
          EOF
